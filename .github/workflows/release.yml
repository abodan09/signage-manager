name: Build & Release

on:
  push:
    tags:
      - 'v*'
  # Manual run builds everything but publishes nothing — use to verify builds
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # ── Windows Desktop App (Electron) ────────────────────────────────────────
  build-desktop:
    name: Build Windows Installer
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Set package version from tag
        if: github.ref_type == 'tag'
        shell: bash
        run: |
          TAG="${{ github.ref_name }}"
          VER="${TAG#v}"
          npm version "$VER" --no-git-tag-version --allow-same-version

      - name: Build & package
        run: npm run dist
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-installer
          path: release/*.exe
          if-no-files-found: error

  # ── Android TV APK (signed release build) ─────────────────────────────────
  build-tv-apk:
    name: Build Android TV APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.4'

      - name: Set app version from tag
        if: github.ref_type == 'tag'
        run: |
          TAG="${{ github.ref_name }}"
          VER="${TAG#v}"
          # versionCode: convert 1.2.3 → 10203 (each part × 100²/100/1)
          IFS='.' read -r MAJ MIN PAT <<< "$VER"
          CODE=$(( (${MAJ:-0} * 10000) + (${MIN:-0} * 100) + (${PAT:-0}) ))
          sed -i "s/versionCode [0-9]*/versionCode $CODE/" tv-app/app/build.gradle
          sed -i "s/versionName \"[^\"]*\"/versionName \"$VER\"/" tv-app/app/build.gradle

      - name: Build release APK
        working-directory: tv-app
        run: gradle assembleRelease --no-daemon

      # Sign with the project keystore so every release has the SAME signature —
      # debug builds were signed with a fresh key per CI run, which breaks
      # in-place updates (users had to uninstall first).
      - name: Sign APK
        env:
          KS_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KS_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          printf '%s' "$KS_B64" | tr -d ' \r\n' | base64 -d > release.p12
          BT="$ANDROID_HOME/build-tools/$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -1)"
          "$BT/zipalign" -f 4 \
            tv-app/app/build/outputs/apk/release/app-release-unsigned.apk \
            signage-tv-player-aligned.apk
          "$BT/apksigner" sign \
            --ks release.p12 \
            --ks-pass env:KS_PASS \
            --out signage-tv-player.apk \
            signage-tv-player-aligned.apk
          "$BT/apksigner" verify --print-certs signage-tv-player.apk | head -4
          rm -f release.p12

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: tv-apk
          path: signage-tv-player.apk
          if-no-files-found: error

  # ── LG webOS IPK ─────────────────────────────────────────────────────────
  build-webos-ipk:
    name: Build LG webOS IPK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Generate webOS icons from SVG
        run: node scripts/generate-icons.mjs

      - name: Set app version from tag
        if: github.ref_type == 'tag'
        run: |
          TAG="${{ github.ref_name }}"
          VER="${TAG#v}"
          tmp=$(jq ".version = \"$VER\"" tv-app-webos/appinfo.json)
          echo "$tmp" > tv-app-webos/appinfo.json
          sed -i "s/__APP_VERSION__/$VER/g" tv-app-webos/index.html

      - name: Install ares-cli
        run: npm install -g @webosose/ares-cli

      - name: Package webOS app
        run: ares-package tv-app-webos/ --outdir dist-webos/

      - name: Upload IPK artifact
        uses: actions/upload-artifact@v4
        with:
          name: webos-ipk
          path: dist-webos/*.ipk
          if-no-files-found: error

  # ── Samsung Tizen WGT (signed — unsigned zips are rejected by real TVs) ──
  build-tizen-wgt:
    name: Build Samsung Tizen WGT
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      # Tizen CLI tooling is Java-8 era — its signer cannot load PKCS12
      # keystores under newer JDKs ("Invaild password" on any keystore)
      - uses: actions/setup-java@v4
        with:
          java-version: '8'
          distribution: 'temurin'

      - name: Install dependencies
        run: npm ci

      - name: Generate Tizen icon from SVG
        run: node scripts/generate-icons.mjs

      - name: Set app version from tag
        if: github.ref_type == 'tag'
        run: |
          TAG="${{ github.ref_name }}"
          VER="${TAG#v}"
          sed -i "s/version=\"[^\"]*\"/version=\"$VER\"/" tv-app-tizen/config.xml
          sed -i "s/__APP_VERSION__/$VER/g" tv-app-tizen/index.html

      # Tizen Studio 5.1 — the version proven to sign headlessly in CI
      # (sourcetoad/tizen-build-action); 6.x hangs/fails on password handling.
      - name: Restore Tizen Studio CLI cache
        id: tizen-cache
        uses: actions/cache/restore@v4
        with:
          path: ~/tizen-studio
          key: tizen-studio-cli-5.1

      - name: Install Tizen Studio CLI
        if: steps.tizen-cache.outputs.cache-hit != 'true'
        run: |
          wget -q "https://download.tizen.org/sdk/Installer/tizen-studio_5.1/web-cli_Tizen_Studio_5.1_ubuntu-64.bin" -O /tmp/tizen-cli.bin
          chmod +x /tmp/tizen-cli.bin
          /tmp/tizen-cli.bin --accept-license "$HOME/tizen-studio"

      # Save even if later steps fail — the 284 MB download shouldn't repeat
      - name: Save Tizen Studio CLI cache
        if: steps.tizen-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ~/tizen-studio
          key: tizen-studio-cli-5.1

      - name: Diagnose CLI layout
        run: |
          ls "$HOME/tizen-studio/tools/ide/bin" || true
          echo "--- certificate-generator ---"
          ls -R "$HOME/tizen-studio/tools/certificate-generator" 2>/dev/null | head -30 || echo "certificate-generator MISSING"

      # The CLI's tooling prompts on a console it doesn't have in CI (silent
      # NPE exits), and its old crypto parser rejects keytool-made PKCS12
      # files as "invalid password" — so generate the author certificate with
      # the CLI itself, under an expect pseudo-terminal.
      - name: Create signing profile
        env:
          TZ_PASS: ${{ secrets.TIZEN_CERT_PASSWORD }}
        run: |
          sudo apt-get install -y -qq expect > /dev/null
          T="$HOME/tizen-studio/tools/ide/bin/tizen"
          AUTHOR_P12="$HOME/tizen-studio-data/keystore/author/signage-author.p12"

          cat > /tmp/make-cert.exp <<'EOF'
          #!/usr/bin/expect -f
          set timeout 120
          spawn $env(HOME)/tizen-studio/tools/ide/bin/tizen certificate -a SignageManager -p $env(TZ_PASS) -c IT -n SignageManager -f signage-author
          expect {
            -re {[Pp]assword.*:} { send -- "$env(TZ_PASS)\r"; exp_continue }
            -re {\(y(es)?/n(o)?\)} { send -- "y\r"; exp_continue }
            timeout { puts "TIMED OUT waiting for tizen certificate"; exit 124 }
            eof
          }
          catch wait result
          exit [lindex $result 3]
          EOF
          expect /tmp/make-cert.exp

          if [ ! -f "$AUTHOR_P12" ]; then
            echo "author certificate was not created"; exit 1
          fi

          # Write profiles.xml directly with plaintext passwords and make it
          # READ-ONLY: on first use the CLI tries to re-encrypt the passwords
          # in-place, and that rewrite is what produces "Invaild password"
          # failures in CI. (Same approach as sourcetoad/tizen-build-action.)
          CERTS="$HOME/tizen-studio/tools/certificate-generator/certificates"
          if [ -f "$CERTS/distributor/sdk-public/tizen-distributor-signer.p12" ]; then
            DIST_KEY="$CERTS/distributor/sdk-public/tizen-distributor-signer.p12"
            DIST_CA="$CERTS/distributor/sdk-public/tizen-distributor-ca.cer"
          else
            DIST_KEY="$CERTS/distributor/tizen-distributor-signer.p12"
            DIST_CA="$CERTS/distributor/tizen-distributor-ca.cer"
          fi
          AUTHOR_CA="$CERTS/developer/tizen-developer-ca.cer"
          [ -f "$AUTHOR_CA" ] || AUTHOR_CA=""

          P="$("$T" cli-config -l | grep -i 'default.profiles.path=' | sed 's/^default\.profiles\.path=//')"
          [ -n "$P" ] || P="$HOME/tizen-studio-data/profile/profiles.xml"
          mkdir -p "$(dirname "$P")"
          cat > "$P" <<EOF
          <?xml version="1.0" encoding="UTF-8" standalone="no"?>
          <profiles active="signage" version="3.1">
              <profile name="signage">
                  <profileitem ca="$AUTHOR_CA" distributor="0" key="$AUTHOR_P12" password="$TZ_PASS" rootca=""/>
                  <profileitem ca="$DIST_CA" distributor="1" key="$DIST_KEY" password="tizenpkcs12passfordsigner" rootca=""/>
                  <profileitem ca="" distributor="2" key="" password="" rootca=""/>
              </profile>
          </profiles>
          EOF
          chmod a-w "$P"

      - name: Package signed WGT
        run: |
          mkdir -p dist-tizen
          timeout 300 "$HOME/tizen-studio/tools/ide/bin/tizen" package -t wgt -s signage -o dist-tizen -- tv-app-tizen || {
            echo "--- cli.log tail ---"
            tail -60 "$HOME/tizen-studio-data/cli/logs/cli.log" || true
            exit 1
          }
          mv dist-tizen/*.wgt dist-tizen/signage-tizen.wgt
          # sanity: a signed widget must contain both signature files
          unzip -l dist-tizen/signage-tizen.wgt | grep -E "author-signature.xml|signature1.xml"

      - name: Upload WGT artifact
        uses: actions/upload-artifact@v4
        with:
          name: tizen-wgt
          path: dist-tizen/signage-tizen.wgt
          if-no-files-found: error

  # ── GitHub Release (tag builds only) ──────────────────────────────────────
  release:
    name: Create GitHub Release
    if: github.ref_type == 'tag'
    needs: [build-desktop, build-tv-apk, build-webos-ipk, build-tizen-wgt]
    runs-on: ubuntu-latest
    steps:
      - name: Download Windows installer
        uses: actions/download-artifact@v4
        with:
          name: windows-installer
          path: artifacts/

      - name: Download Android TV APK
        uses: actions/download-artifact@v4
        with:
          name: tv-apk
          path: artifacts/

      - name: Download webOS IPK
        uses: actions/download-artifact@v4
        with:
          name: webos-ipk
          path: artifacts/

      - name: Download Tizen WGT
        uses: actions/download-artifact@v4
        with:
          name: tizen-wgt
          path: artifacts/

      - name: Rename artifacts for clarity
        run: |
          mv artifacts/com.signage.tvplayer_*.ipk artifacts/signage-webos-player.ipk

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          name: Signage Manager ${{ github.ref_name }}
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: |
            artifacts/*.exe
            artifacts/*.apk
            artifacts/*.ipk
            artifacts/*.wgt
