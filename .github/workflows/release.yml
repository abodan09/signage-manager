name: Build & Release

on:
  push:
    tags:
      - 'v*'
  # Manual run builds everything but publishes nothing — use to verify builds
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # ── Windows Desktop App (Electron) ────────────────────────────────────────
  build-desktop:
    name: Build Windows Installer
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Set package version from tag
        if: github.ref_type == 'tag'
        shell: bash
        run: |
          TAG="${{ github.ref_name }}"
          VER="${TAG#v}"
          npm version "$VER" --no-git-tag-version --allow-same-version

      - name: Build & package
        run: npm run dist
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-installer
          path: release/*.exe
          if-no-files-found: error

  # ── Android TV APK (signed release build) ─────────────────────────────────
  build-tv-apk:
    name: Build Android TV APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.4'

      - name: Set app version from tag
        if: github.ref_type == 'tag'
        run: |
          TAG="${{ github.ref_name }}"
          VER="${TAG#v}"
          # versionCode: convert 1.2.3 → 10203 (each part × 100²/100/1)
          IFS='.' read -r MAJ MIN PAT <<< "$VER"
          CODE=$(( (${MAJ:-0} * 10000) + (${MIN:-0} * 100) + (${PAT:-0}) ))
          sed -i "s/versionCode [0-9]*/versionCode $CODE/" tv-app/app/build.gradle
          sed -i "s/versionName \"[^\"]*\"/versionName \"$VER\"/" tv-app/app/build.gradle

      - name: Build release APK
        working-directory: tv-app
        run: gradle assembleRelease --no-daemon

      # Sign with the project keystore so every release has the SAME signature —
      # debug builds were signed with a fresh key per CI run, which breaks
      # in-place updates (users had to uninstall first).
      - name: Sign APK
        env:
          KS_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KS_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          printf '%s' "$KS_B64" | tr -d ' \r\n' | base64 -d > release.p12
          BT="$ANDROID_HOME/build-tools/$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -1)"
          "$BT/zipalign" -f 4 \
            tv-app/app/build/outputs/apk/release/app-release-unsigned.apk \
            signage-tv-player-aligned.apk
          "$BT/apksigner" sign \
            --ks release.p12 \
            --ks-pass env:KS_PASS \
            --out signage-tv-player.apk \
            signage-tv-player-aligned.apk
          "$BT/apksigner" verify --print-certs signage-tv-player.apk | head -4
          rm -f release.p12

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: tv-apk
          path: signage-tv-player.apk
          if-no-files-found: error

  # ── LG webOS IPK ─────────────────────────────────────────────────────────
  build-webos-ipk:
    name: Build LG webOS IPK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Generate webOS icons from SVG
        run: node scripts/generate-icons.mjs

      - name: Set app version from tag
        if: github.ref_type == 'tag'
        run: |
          TAG="${{ github.ref_name }}"
          VER="${TAG#v}"
          tmp=$(jq ".version = \"$VER\"" tv-app-webos/appinfo.json)
          echo "$tmp" > tv-app-webos/appinfo.json
          sed -i "s/__APP_VERSION__/$VER/g" tv-app-webos/index.html

      - name: Install ares-cli
        run: npm install -g @webosose/ares-cli

      - name: Package webOS app
        run: ares-package tv-app-webos/ --outdir dist-webos/

      - name: Upload IPK artifact
        uses: actions/upload-artifact@v4
        with:
          name: webos-ipk
          path: dist-webos/*.ipk
          if-no-files-found: error

  # ── Samsung Tizen WGT (signed — unsigned zips are rejected by real TVs) ──
  # Signing is done in pure JS with Samsung's @tizentv/webide-common-tizentv
  # (the engine behind their VS Code extension). Tizen Studio CLI is NOT used:
  # every headless path through it (certificate/security-profiles/package)
  # either NPEs on a missing console or rejects its own keystore passwords.
  build-tizen-wgt:
    name: Build Samsung Tizen WGT
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Generate Tizen icon from SVG
        run: node scripts/generate-icons.mjs

      - name: Set app version from tag
        if: github.ref_type == 'tag'
        run: |
          TAG="${{ github.ref_name }}"
          VER="${TAG#v}"
          sed -i "s/version=\"[^\"]*\"/version=\"$VER\"/" tv-app-tizen/config.xml
          sed -i "s/__APP_VERSION__/$VER/g" tv-app-tizen/index.html

      - name: Install Tizen signing library
        run: npm install --no-save "@tizentv/webide-common-tizentv@1.0.20"

      - name: Build & sign WGT
        env:
          TIZEN_CERT_PASSWORD: ${{ secrets.TIZEN_CERT_PASSWORD }}
        run: |
          node scripts/build-tizen-wgt.js
          # sanity: a signed widget must contain both signature files
          unzip -l dist-tizen/signage-tizen.wgt | grep -E "author-signature.xml|signature1.xml"

      - name: Upload WGT artifact
        uses: actions/upload-artifact@v4
        with:
          name: tizen-wgt
          path: dist-tizen/signage-tizen.wgt
          if-no-files-found: error

  # ── GitHub Release (tag builds only) ──────────────────────────────────────
  release:
    name: Create GitHub Release
    if: github.ref_type == 'tag'
    needs: [build-desktop, build-tv-apk, build-webos-ipk, build-tizen-wgt]
    runs-on: ubuntu-latest
    steps:
      - name: Download Windows installer
        uses: actions/download-artifact@v4
        with:
          name: windows-installer
          path: artifacts/

      - name: Download Android TV APK
        uses: actions/download-artifact@v4
        with:
          name: tv-apk
          path: artifacts/

      - name: Download webOS IPK
        uses: actions/download-artifact@v4
        with:
          name: webos-ipk
          path: artifacts/

      - name: Download Tizen WGT
        uses: actions/download-artifact@v4
        with:
          name: tizen-wgt
          path: artifacts/

      - name: Rename artifacts for clarity
        run: |
          mv artifacts/com.signage.tvplayer_*.ipk artifacts/signage-webos-player.ipk

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          name: Signage Manager ${{ github.ref_name }}
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: |
            artifacts/*.exe
            artifacts/*.apk
            artifacts/*.ipk
            artifacts/*.wgt
