<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!-- Void background -->
  <rect width="32" height="32" rx="6" fill="#05080f"/>

  <!-- TV screen, glow outline -->
  <rect x="4" y="7.5" width="24" height="15" rx="1.5" fill="#0d1b31" stroke="#4cc9ff" stroke-width="1.8"/>

  <!-- Screen content: headline bar + lines -->
  <rect x="7" y="10.5" width="12" height="4" fill="#4cc9ff"/>
  <rect x="7" y="16.5" width="14" height="1.6" fill="#24365a"/>
  <rect x="7" y="19" width="10" height="1.6" fill="#24365a"/>

  <!-- Live dot -->
  <circle cx="23.5" cy="12.5" r="1.8" fill="#3ddc97"/>

  <!-- Stand -->
  <rect x="13.5" y="23.5" width="5" height="2" fill="#24365a"/>
  <rect x="10.5" y="26" width="11" height="1.6" fill="#24365a"/>
</svg>
